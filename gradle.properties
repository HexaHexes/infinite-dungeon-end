org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=infinite_dungeon_end
mod_name=Infinite Dungeon: End
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.02
mod_group_id=org.bitwisemadness.infinitedungeon
mod_authors=Bitwise Madness
mod_description=Adds the End dimension: a new infinite dungeon dimension with its own dungeon portal, themed and stocked from the Dungeon Crawl - Dimensional Patch dc_dp_the_end datapack. One of seven sibling dimension addons for Infinite Dungeon.

# The infinite-dungeon-api release this addon builds against. Referenced by
# build.gradle (compile/runtime/test) and by the toml's required-dependency
# range - the API is the platform (I32): integrations come from it, never
# from the Infinite Dungeon core mod.
api_version=1.0.0-alpha.16

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
